name: MCP Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/mcp/**'
      - 'integrations/chatgpt/**'
      - 'integrations/claude/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/publish-mcp-registry.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/mcp/**'
      - 'integrations/chatgpt/**'
      - 'integrations/claude/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/publish-mcp-registry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MCP dependencies
        run: npm --prefix integrations/mcp install --ignore-scripts
      - name: Test MCP contracts
        run: npm --prefix integrations/mcp test
      - name: Dependency audit
        run: npm --prefix integrations/mcp audit --audit-level=high
      - name: Validate Claude plugin package
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate integrations/claude
      - name: Smoke remote MCP service
        shell: bash
        run: |
          npm --prefix integrations/mcp start > /tmp/convoweave-mcp.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8790/healthz > /tmp/mcp-health.json; then
              cat /tmp/mcp-health.json
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8790/healthz >/dev/null || { cat /tmp/convoweave-mcp.log; exit 1; }
      - name: Build and smoke MCP container
        shell: bash
        run: |
          docker build -t convoweave-mcp:ci integrations/mcp
          docker run --rm -d --name convoweave-mcp-ci -e PORT=8790 -p 8790:8790 convoweave-mcp:ci
          trap 'docker rm -f convoweave-mcp-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/healthz > /tmp/mcp-container-health.json; then
              cat /tmp/mcp-container-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs convoweave-mcp-ci
          exit 1
