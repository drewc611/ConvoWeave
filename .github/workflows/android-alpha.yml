name: Android Alpha Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'release/ALPHA_VERSION'
      - 'docs/releases/**'
      - '.github/workflows/android-alpha.yml'
  push:
    branches: [main]
    paths:
      - 'release/ALPHA_VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Release preflight
        run: npm run release:check

  build_android_alpha:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug-signed alpha APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < release/ALPHA_VERSION)"
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ConvoWeave-${VERSION}-Android.apk"
          cp "docs/releases/${VERSION}.md" dist/RELEASE_NOTES.md
          sha256sum "dist/ConvoWeave-${VERSION}-Android.apk" > dist/SHA256SUMS.txt
          {
            echo "ConvoWeave internal alpha package"
            echo "release=${VERSION}"
            echo "app_version=${APP_VERSION}"
            echo "android_version_code=${VERSION_CODE}"
            echo "git_sha=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "artifact_type=debug-signed Android APK for internal QA only"
          } > dist/MANIFEST.txt

      - name: Upload alpha package
        uses: actions/upload-artifact@v6
        with:
          name: ConvoWeave-0.3.0-alpha.1-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
