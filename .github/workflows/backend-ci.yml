name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.dockerignore'
      - 'docs/BACKEND_API.md'
      - 'docs/adr/**'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.dockerignore'
      - 'docs/BACKEND_API.md'
      - 'docs/adr/**'

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm --prefix backend install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Syntax checks
        run: |
          node --check backend/config.mjs
          node --check backend/server.mjs
          node --check backend/openai-live-smoke.mjs
          node --check backend/auth/index.mjs
          node --check backend/auth/developmentToken.mjs
          node --check backend/auth/oidc.mjs
          node --check backend/providers/index.mjs
          node --check backend/providers/deterministic.mjs
          node --check backend/providers/openai.mjs
          node --check backend/storage/index.mjs
          node --check backend/storage/sessionStore.mjs
          node --check backend/storage/audioStore.mjs

      - name: Backend auth, contract, persistence, and retention tests
        run: npm --prefix backend test

      - name: Backend dependency audit
        run: npm --prefix backend audit --audit-level=high --omit=dev

      - name: Build backend container
        run: docker build -f backend/Dockerfile -t convoweave-backend:test .

      - name: Smoke test development container
        run: |
          docker run -d --rm \
            --name convoweave-backend-test \
            -p 8787:8787 \
            -e CONVOWEAVE_ENV=development \
            -e CONVOWEAVE_AUTH_MODE=development-token \
            -e CONVOWEAVE_DEV_TOKEN=ci-development-token \
            -e CONVOWEAVE_PROCESSING_PROVIDER=deterministic \
            convoweave-backend:test
          trap 'docker stop convoweave-backend-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/healthz
          curl --fail --silent http://127.0.0.1:8787/readyz | grep 'development-token'
          docker stop convoweave-backend-test >/dev/null
          trap - EXIT

      - name: Smoke test preview filesystem storage
        run: |
          mkdir -p "$RUNNER_TEMP/convoweave-data"
          chmod 0777 "$RUNNER_TEMP/convoweave-data"
          docker run -d --rm \
            --name convoweave-backend-preview-test \
            -p 8788:8787 \
            -v "$RUNNER_TEMP/convoweave-data:/data/convoweave" \
            -e CONVOWEAVE_ENV=preview \
            -e CONVOWEAVE_AUTH_MODE=development-token \
            -e CONVOWEAVE_DEV_TOKEN=ci-preview-token \
            -e CONVOWEAVE_PROCESSING_PROVIDER=deterministic \
            -e CONVOWEAVE_STORAGE_MODE=filesystem \
            -e CONVOWEAVE_AUDIO_RETENTION=delete-after-processing \
            convoweave-backend:test
          trap 'docker stop convoweave-backend-preview-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8788/readyz | grep 'filesystem'
