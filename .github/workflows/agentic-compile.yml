name: Compile Agentic Workflows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-*.md'
      - '.github/workflows/agentic-compile.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentic-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GitHub Agentic Workflows extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile agentic workflow sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/agent-*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No agentic workflow sources found.'
            exit 0
          fi
          for file in "${files[@]}"; do
            gh aw compile "$file"
          done

      - name: Open lockfile PR when compilation changes output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          lockfiles=(.github/workflows/*.lock.yml)
          if [ ${#lockfiles[@]} -eq 0 ]; then
            echo 'No compiled lockfiles were produced.' >&2
            exit 1
          fi

          changed=0
          for file in "${lockfiles[@]}"; do
            if ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              changed=1
              break
            fi
            if ! git diff --quiet -- "$file"; then
              changed=1
              break
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo 'Compiled lockfiles are current.'
            exit 0
          fi

          branch="automation/agentic-lockfiles-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add .github/workflows/*.lock.yml
          git commit -m 'Compile ConvoWeave agentic workflows'
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Compile ConvoWeave agentic workflows' \
            --body 'Generated by `gh aw compile`. Review and merge only if normal CI/security checks remain green.'
