# Read-only compiler gate. Do not grant workflow-file write authority to this job.
name: Compile Agentic Workflows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-*.md'
      - '.github/workflows/agent-*.lock.yml'
      - '.github/workflows/agentic-compile.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-*.md'
      - '.github/workflows/agent-*.lock.yml'
      - '.github/workflows/agentic-compile.yml'

permissions:
  contents: read

concurrency:
  group: agentic-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned GitHub Agentic Workflows extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.88.7

      - name: Verify compiler version
        run: gh aw version

      - name: Compile agentic workflow sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/agent-*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No agentic workflow sources found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            gh aw compile "$file"
          done

      - name: Verify compiled lockfiles exist
        run: |
          set -euo pipefail
          shopt -s nullglob
          lockfiles=(.github/workflows/*.lock.yml)
          if [ ${#lockfiles[@]} -eq 0 ]; then
            echo 'No compiled lockfiles were produced.' >&2
            exit 1
          fi
          printf '%s\n' "${lockfiles[@]}"

      - name: Upload compiled lockfiles
        uses: actions/upload-artifact@v6
        with:
          name: convoweave-agentic-lockfiles
          path: .github/workflows/*.lock.yml
          if-no-files-found: error
          retention-days: 7

      - name: Verify lockfiles are committed and current
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all -- .github/workflows/*.lock.yml)"
          if [ -n "$status" ]; then
            echo 'Compiled agentic lockfiles are missing or stale:' >&2
            printf '%s\n' "$status" >&2
            echo 'Download the convoweave-agentic-lockfiles artifact, review the generated YAML, and commit the exact lockfiles through the same pull request.' >&2
            exit 1
          fi
          echo 'Compiled agentic lockfiles are committed and current.'
