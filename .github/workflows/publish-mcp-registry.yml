name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      remote_url:
        description: 'Public production MCP URL, including /mcp'
        required: true
        type: string
      version:
        description: 'Registry metadata version'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production endpoint
        env:
          REMOTE_URL: ${{ inputs.remote_url }}
        run: |
          case "$REMOTE_URL" in
            https://*/mcp) ;;
            *) echo "remote_url must be an HTTPS URL ending in /mcp" >&2; exit 1 ;;
          esac
          BASE_URL="${REMOTE_URL%/mcp}"
          curl --fail --silent --show-error "$BASE_URL/healthz" >/dev/null
          curl --fail --silent --show-error "$BASE_URL/.well-known/oauth-protected-resource" >/dev/null

      - name: Generate registry server.json
        env:
          REMOTE_URL: ${{ inputs.remote_url }}
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg url "$REMOTE_URL" --arg version "$VERSION" \
            '.version = $version | .remotes[0].url = $url' \
            integrations/mcp/server.registry.template.json > integrations/mcp/server.json
          cat integrations/mcp/server.json

      # Pinned release with SHA256 values copied from the release's own
      # registry_1.8.1_checksums.txt. To upgrade, change the version and both
      # hashes together from the new release's checksums file.
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256_LINUX_AMD64: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          MCP_PUBLISHER_SHA256_LINUX_ARM64: 8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; expected="$MCP_PUBLISHER_SHA256_LINUX_AMD64" ;;
            aarch64) arch=arm64; expected="$MCP_PUBLISHER_SHA256_LINUX_ARM64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="mcp-publisher_linux_${arch}.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm "$archive"

      - name: Authenticate with GitHub OIDC
        working-directory: integrations/mcp
        run: ../../mcp-publisher login github-oidc

      - name: Publish ConvoWeave to official MCP Registry
        working-directory: integrations/mcp
        run: ../../mcp-publisher publish
