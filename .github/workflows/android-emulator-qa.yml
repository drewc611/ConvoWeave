name: Android Emulator QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'release/BETA_VERSION'
      - '.github/workflows/android-emulator-qa.yml'
  push:
    branches: [main]
    paths:
      - 'release/BETA_VERSION'
      - 'app.json'
      - '.github/workflows/android-emulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  ANDROID_PACKAGE: com.convoweave.mobile
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  emulator_smoke:
    name: Install, launch and capture runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate app before native generation
        run: |
          npm run typecheck
          npm test
          npm run release:check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone beta APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify standalone bundle exists
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -Eq 'assets/index.android.bundle|assets/.+\.bundle'

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          test -n "$AVDMANAGER" && test -x "$AVDMANAGER"
          mkdir -p "$ANDROID_AVD_HOME"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            'emulator' \
            'platforms;android-35' \
            'system-images;android-35;google_apis;x86_64'

          echo no | "$AVDMANAGER" create avd \
            --force \
            --name convoweave-ci \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'

          test -f "$ANDROID_AVD_HOME/convoweave-ci.ini"
          "$SDK_ROOT/emulator/emulator" -list-avds | grep -Fx 'convoweave-ci'
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Start emulator and wait for Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -f "$ANDROID_AVD_HOME/convoweave-ci.ini"

          mkdir -p qa-runtime
          "$ADB" start-server

          ACCEL_ARGS='-accel off'
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL_ARGS='-accel on'
          fi

          nohup "$EMULATOR" \
            -avd convoweave-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            $ACCEL_ARGS \
            -wipe-data \
            > qa-runtime/emulator.log 2>&1 &
          EMULATOR_PID=$!

          for attempt in $(seq 1 100); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android emulator exited before becoming available.' >&2
              cat qa-runtime/emulator.log >&2 || true
              exit 1
            fi
            if "$ADB" devices | grep -Eq '^emulator-[0-9]+[[:space:]]+(device|offline)$'; then
              break
            fi
            if [ "$attempt" -eq 100 ]; then
              echo 'Android emulator did not appear in adb.' >&2
              cat qa-runtime/emulator.log >&2 || true
              exit 1
            fi
            sleep 3
          done

          for attempt in $(seq 1 100); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android emulator exited during boot.' >&2
              cat qa-runtime/emulator.log >&2 || true
              exit 1
            fi
            if [ "$attempt" -eq 100 ]; then
              echo 'Android emulator did not finish booting.' >&2
              cat qa-runtime/emulator.log >&2 || true
              exit 1
            fi
            sleep 3
          done
          "$ADB" shell input keyevent 82 || true
          "$ADB" devices

      - name: Install standalone beta APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ADB" install -r "$APK"
          "$ADB" shell pm path "$ANDROID_PACKAGE"
          "$ADB" shell pm grant "$ANDROID_PACKAGE" android.permission.RECORD_AUDIO || true

      - name: Launch ConvoWeave and verify foreground process
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          "$ADB" logcat -c
          "$ADB" shell monkey -p "$ANDROID_PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 18

          PID="$("$ADB" shell pidof "$ANDROID_PACKAGE" | tr -d '\r')"
          if [ -z "$PID" ]; then
            echo 'ConvoWeave process is not running after launch.' >&2
            "$ADB" shell dumpsys activity activities >&2 || true
            exit 1
          fi

          "$ADB" shell dumpsys activity activities > qa-runtime/activity.txt
          "$ADB" logcat --pid="$PID" -d > qa-runtime/app-logcat.txt || true
          "$ADB" exec-out screencap -p > qa-runtime/launch-screen.png
          "$ADB" shell uiautomator dump /sdcard/convoweave-window.xml >/dev/null 2>&1 || true
          "$ADB" pull /sdcard/convoweave-window.xml qa-runtime/window.xml >/dev/null 2>&1 || true

          if ! grep -q "$ANDROID_PACKAGE" qa-runtime/activity.txt; then
            echo 'ConvoWeave is not present in the resumed activity state.' >&2
            exit 1
          fi

          if grep -Eqi 'FATAL EXCEPTION|Unable to load script|Could not connect to development server' qa-runtime/app-logcat.txt; then
            echo 'Fatal runtime condition found in ConvoWeave logcat.' >&2
            cat qa-runtime/app-logcat.txt >&2
            exit 1
          fi

          {
            echo '# ConvoWeave Android emulator QA'
            echo
            echo '- Result: PASS'
            echo "- Package: $ANDROID_PACKAGE"
            echo "- Beta version: $(tr -d '\r\n' < release/BETA_VERSION)"
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo '- Emulator: Pixel 6 profile / Android API 35'
            echo '- APK: standalone release-mode internal beta candidate'
            echo '- JavaScript bundle: embedded; no Metro runtime dependency'
            echo '- Verified: install, package registration, process launch, resumed activity, no fatal launch error, runtime screenshot capture'
            echo '- Scope note: emulator QA does not replace physical-device microphone/interruption/restart validation.'
          } > qa-runtime/QA_RESULT.md

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ConvoWeave-Android-Emulator-QA-${{ github.sha }}
          path: qa-runtime/
          if-no-files-found: warn
          retention-days: 30
